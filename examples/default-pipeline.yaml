# Default Herdr Orchestrator pipeline: triage → implement → review → merge-gate.
#
# Scaffold a copy wired to your repo with:
#   orchestratord init --repo <owner>/<name>
# or copy this file + prompts/ by hand and edit the two marked lines below.
# Validate with: orchestratord validate <your-copy>.yaml
version: 0
name: default-pipeline
entry_state: intake

policies:
  max_concurrent_tasks: 4
  # dry_run withholds the real merge: tasks halt at `merging` as a success.
  # Flip to false once a supervised dry pass looks right.
  dry_run: true
  circuit_breaker: false
  retry_caps:
    changes_requested: 3
  execution:
    backend: herdr
    run_as: non_root
    sandbox: true

sources:
  - id: gh_issues
    type: github_issues
    repo: your-github-user/your-repo # EDIT: the GitHub repo whose issues to poll
    select:
      label: agent-ready # EDIT (optional): only issues with this label are picked up
    emits_to: intake

roles:
  triager:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task
  implementer:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task
  reviewer:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task

gates:
  pr_exists:
    type: github_pr
    head: "{branch}"
  ci_green:
    type: github_checks
    all_passing: true
  # Unused by default: GitHub forbids approving your own PR, so on a
  # single-account repo this gate can never clear. On a team repo, add
  # `approvals` to the two merge-gate lists below (states `approved` and
  # `blocked_on_gate`) to require a human review before merge.
  approvals:
    type: github_reviews
    min_approved: 1
  no_conflicts:
    type: github_mergeable
    require: clean

decisions:
  triage:
    impl:
      type: llm
      rubric: prompts/triage.md
    verdicts: [accept, reject, needs_human]
  review:
    impl:
      type: llm
      rubric: prompts/review.md
    verdicts: [approve, request_changes, escalate]

states:
  intake:
    entry: { spawn: triager }
    transitions:
      - when: { event: agent.done }
        evaluate: { decision: triage }
        branch: { accept: queued, reject: closed, needs_human: escalated }
      - when: { timeout: 15m }
        to: escalated

  queued:
    transitions:
      - when: { event: scheduled }
        to: implementing

  implementing:
    entry: { spawn: implementer }
    transitions:
      - when: { event: agent.done }
        evaluate: { gate: pr_exists }
        branch: { pass: pr_open, fail: escalated }
      - when: { event: agent.blocked }
        action: { alert: needs_input }
      - when: { timeout: 45m }
        to: escalated

  pr_open:
    entry: { spawn: reviewer }
    transitions:
      - when: { event: agent.done }
        evaluate: { decision: review }
        branch: { approve: approved, request_changes: changes_requested, escalate: escalated }

  changes_requested:
    entry: { resume: implementer, with: review_feedback }
    transitions:
      - when: { event: agent.done }
        evaluate: { gate: pr_exists }
        branch: { pass: pr_open, fail: escalated }
      - when: { event: retry_exhausted }
        to: escalated

  approved:
    transitions:
      - when: { event: status.changed }
        evaluate: { gate: [ci_green, no_conflicts] }
        branch: { pass: merging, fail: blocked_on_gate }

  merging:
    entry: { action: merge_pr }
    transitions:
      - when: { event: pr.merged }
        to: merged

  merged: { terminal: success }
  closed: { terminal: rejected }
  escalated: { terminal: needs_human, alert: true }

  blocked_on_gate:
    transitions:
      - when: { event: status.changed }
        evaluate: { gate: [ci_green, no_conflicts] }
        branch: { pass: merging, fail: blocked_on_gate }
      - when: { timeout: 30m }
        to: escalated
