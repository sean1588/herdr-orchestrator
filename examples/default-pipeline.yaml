# Default Herdr Orchestrator pipeline: triage → implement → review → merge-gate.
#
# Scaffold a copy wired to your repo with:
#   orchestratord init --repo <owner>/<name>
# or copy this file + prompts/ by hand and edit the two marked lines below.
# Validate with: orchestratord validate <your-copy>.yaml
version: 0
name: default-pipeline
entry_state: intake

policies:
  max_concurrent_tasks: 4
  # dry_run withholds the real merge: tasks halt at `merging` as a success.
  # Flip to false once a supervised dry pass looks right.
  dry_run: true
  circuit_breaker: false
  retry_caps:
    changes_requested: 3
  # --- liveness bounds -------------------------------------------------------
  # Three layers, deliberately independent. A per-state `timeout:` below is an
  # OVERRIDE for the one thing that genuinely varies per state ("this one
  # legitimately takes 90 minutes"); these cover everything else by default, so
  # nothing is unbounded merely because nobody remembered to annotate it.
  #
  # How long a task may go without ANY observable signal — the global bound.
  # A state timeout measures POSITION ("how long in this state"), which cannot
  # tell a slow agent from a dead one. This measures PROGRESS: any pane status
  # event resets it, and when it expires the engine confirms against the agent
  # pane's own bytes before escalating. Omit for the 30m default; "0s" disables
  # it, but then every agent state must declare its own timeout (validated).
  no_progress_timeout: 30m
  # How long an agent may sit *continuously* blocked on an interactive prompt
  # nobody will answer. Blocking doesn't change state and a state timeout runs
  # from state entry, so without this a parked agent burns the full state timeout
  # doing nothing. Any "working" event clears the clock, so a prompt the agent
  # resolves itself never counts. Remove the key to rely on the bounds above.
  blocked_timeout: 10m
  # Hard ceiling on a single drive, enforced by the scheduler's reaper from
  # OUTSIDE the drive — the only bound that still works when a drive is wedged
  # somewhere the engine has no timer armed at all (a spawn, a gate read, a
  # decision, a merge). Omit to derive it: twice the longest state timeout below,
  # floored at 1h. An explicit value at or below the longest state timeout is
  # rejected, because it would preempt the transitions it is meant to back up.
  # drive_deadline: 3h
  execution:
    backend: herdr
    run_as: non_root
    sandbox: true

sources:
  - id: gh_issues
    type: github_issues
    repo: your-github-user/your-repo # EDIT: the GitHub repo whose issues to poll
    select:
      label: agent-ready # EDIT (optional): only issues with this label are picked up
    emits_to: intake

roles:
  triager:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task
  implementer:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task
  reviewer:
    launch: ["claude"]
    task_delivery: context_file
    workspace: per_task

gates:
  pr_exists:
    type: github_pr
    head: "{branch}"
  ci_green:
    type: github_checks
    all_passing: true
  # Unused by default: GitHub forbids approving your own PR, so on a
  # single-account repo this gate can never clear. On a team repo, add
  # `approvals` to the two merge-gate lists below (states `approved` and
  # `blocked_on_gate`) to require a human review before merge.
  approvals:
    type: github_reviews
    min_approved: 1
  no_conflicts:
    type: github_mergeable
    require: clean

decisions:
  triage:
    impl:
      type: llm
      rubric: prompts/triage.md
    verdicts: [accept, reject, needs_human]
  review:
    impl:
      type: llm
      rubric: prompts/review.md
    verdicts: [approve, request_changes, escalate]

states:
  intake:
    entry: { spawn: triager }
    transitions:
      - when: { event: agent.done }
        evaluate: { decision: triage }
        branch: { accept: queued, reject: closed, needs_human: escalated }
      - when: { timeout: 15m }
        to: escalated

  queued:
    transitions:
      - when: { event: scheduled }
        to: implementing

  implementing:
    entry: { spawn: implementer }
    transitions:
      - when: { event: agent.done }
        evaluate: { gate: pr_exists }
        branch: { pass: pr_open, fail: escalated }
      - when: { event: agent.blocked }
        action: { alert: needs_input }
      - when: { timeout: 45m }
        to: escalated

  pr_open:
    entry: { spawn: reviewer }
    transitions:
      - when: { event: agent.done }
        evaluate: { decision: review }
        branch: { approve: approved, request_changes: changes_requested, escalate: escalated }

  changes_requested:
    entry: { resume: implementer, with: review_feedback }
    transitions:
      - when: { event: agent.done }
        evaluate: { gate: pr_exists }
        branch: { pass: pr_open, fail: escalated }
      - when: { event: retry_exhausted }
        to: escalated

  approved:
    transitions:
      - when: { event: status.changed }
        evaluate: { gate: [ci_green, no_conflicts] }
        branch: { pass: merging, fail: blocked_on_gate }

  merging:
    entry: { action: merge_pr }
    transitions:
      - when: { event: pr.merged }
        to: merged

  merged: { terminal: success }
  closed: { terminal: rejected }
  escalated: { terminal: needs_human, alert: true }

  blocked_on_gate:
    transitions:
      - when: { event: status.changed }
        evaluate: { gate: [ci_green, no_conflicts] }
        branch: { pass: merging, fail: blocked_on_gate }
      - when: { timeout: 30m }
        to: escalated
